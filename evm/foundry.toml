[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32, fail_on_revert = true }

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 128, depth = 64, fail_on_revert = true }

[fmt]
ignore = [
    "src/*.sol",
    "lib/**/*.sol",
    "test/Machine.t.sol",
    "test/MockPrizeNFT.sol",
    "test/MockPrizeERC721.sol",
]

[rpc_endpoints]
base = "https://mainnet.base.org"
arbitrum = "https://arb1.arbitrum.io/rpc"
optimism = "https://mainnet.optimism.io"
mainnet = "https://ethereum-rpc.publicnode.com"
